# Applies db/schema.sql (idempotent). The ConfigMap "db-schema" is created from the file by scripts/deploy.sh.
# Jobs are immutable, so deploy.sh deletes this Job before re-applying it.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: tickertape
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -h postgres -f /schema/schema.sql
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
          volumeMounts:
            - {name: schema, mountPath: /schema}
      volumes:
        - name: schema
          configMap: {name: db-schema}
