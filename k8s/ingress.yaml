# Traefik (k3s built-in). Hostnames need an entry in your hosts file pointing at the node IP (Traefik's LoadBalancer).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ner
  namespace: tickertape
spec:
  rules:
    - host: ner.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ner
                port: {name: ui}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laya
  namespace: tickertape
spec:
  rules:
    - host: laya.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laya
                port: {name: ui}
