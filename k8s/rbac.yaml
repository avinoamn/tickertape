# Namespace-scoped deploy identity. Applied once by an admin (scripts/bootstrap-access.sh).
# The "deployer" can manage workloads inside namespace tickertape and nothing else:
# no cluster-scoped objects (namespaces, nodes, CRDs, RBAC) and no other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: tickertape
---
# Long-lived token for the ServiceAccount (k8s 1.24+ no longer creates one automatically).
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: tickertape
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: tickertape
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]   # step 4 (kube-prometheus-stack CRDs)
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: tickertape
subjects:
  - {kind: ServiceAccount, name: deployer, namespace: tickertape}
roleRef:
  {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
