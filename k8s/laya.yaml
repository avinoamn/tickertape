# Image is imported into k3s by scripts/ship.sh (no registry): IfNotPresent, bump the tag on each release.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache-laya
  namespace: tickertape
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  namespace: tickertape
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO cache volume + 3.5Gi memory limit: never run two pods at once
  selector:
    matchLabels: {app: laya}
  template:
    metadata:
      labels: {app: laya}
    spec:
      containers:
        - name: laya
          image: tickertape/laya:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - {name: ui, containerPort: 7860}
            - {name: metrics, containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: DATABASE_URL}}
            - name: USE_TF
              value: "0"
            # Match the 2-core CPU limit below: torch would otherwise start 4 threads (nproc) and get throttled.
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            # Fine-tuned in step 5 (private repo, Claude Code labels; eval in training/reports/laya_eval.md). Pinned to a
            # commit. Base model for rollback: LAYA_MODEL=convaiinnovations/laya and no LAYA_REVISION.
            - name: LAYA_MODEL
              value: avinoamn/tickertape-laya
            - name: LAYA_REVISION
              value: b02c4f5ce4fe47515d697cb0e6d5f100c5c413b8
            - name: HF_TOKEN              # the name huggingface_hub reads; value = read token for the private repo
              valueFrom: {secretKeyRef: {name: hf-read-token, key: HF_READ_TOKEN}}   # scripts/create-hf-secret.sh
          readinessProbe:       # /metrics only starts after the model is loaded
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 3.5Gi}   # cpu: leaves 2 of computa's 4 cores for everything else
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: hf-cache
          persistentVolumeClaim: {claimName: hf-cache-laya}
---
apiVersion: v1
kind: Service
metadata:
  name: laya
  namespace: tickertape
  labels: {app: laya}
spec:
  selector: {app: laya}
  ports:
    - {name: ui, port: 7860, targetPort: ui}
    - {name: metrics, port: 8000, targetPort: metrics}
---
# UI reachable from any device on the LAN/Tailscale without a tunnel or hosts file: http://computa:30003
# (same pattern as ner-ui on :30002). Metrics stay on the ClusterIP service above.
apiVersion: v1
kind: Service
metadata:
  name: laya-ui
  namespace: tickertape
  labels: {app: laya}
spec:
  type: NodePort
  selector: {app: laya}
  ports:
    - {name: ui, port: 7860, targetPort: ui, nodePort: 30003}
