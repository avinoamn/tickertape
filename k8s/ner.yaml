# Image is imported into k3s by scripts/ship.sh (no registry): IfNotPresent, bump the tag on each release.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache-ner
  namespace: tickertape
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ner
  namespace: tickertape
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO cache volume + 2Gi memory limit: never run two pods at once
  selector:
    matchLabels: {app: ner}
  template:
    metadata:
      labels: {app: ner}
    spec:
      containers:
        - name: ner
          image: tickertape/ner:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: ui, containerPort: 7860}
            - {name: metrics, containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: DATABASE_URL}}
            - name: SEC_USER_AGENT
              valueFrom: {secretKeyRef: {name: poller-config, key: SEC_USER_AGENT}}
          readinessProbe:       # /metrics only starts after the model is loaded
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: hf-cache
          persistentVolumeClaim: {claimName: hf-cache-ner}
---
apiVersion: v1
kind: Service
metadata:
  name: ner
  namespace: tickertape
  labels: {app: ner}
spec:
  selector: {app: ner}
  ports:
    - {name: ui, port: 7860, targetPort: ui}
    - {name: metrics, port: 8000, targetPort: metrics}
---
# UI reachable from any device on the LAN/Tailscale without a tunnel or hosts file: http://computa:30002
# (same pattern as uptime-kuma on :30001). Metrics stay on the ClusterIP service above.
apiVersion: v1
kind: Service
metadata:
  name: ner-ui
  namespace: tickertape
  labels: {app: ner}
spec:
  type: NodePort
  selector: {app: ner}
  ports:
    - {name: ui, port: 7860, targetPort: ui, nodePort: 30002}
