# Scrape ner and laya /metrics (Services `ner` and `laya`, port `metrics`). Needs the Prometheus Operator CRDs
# from k8s/monitoring/values.yaml (kube-prometheus-stack), so apply this after the stack is installed.
# The poller is a short-lived CronJob and is not scraped: poller.json reads Postgres + kube-state-metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ner
  namespace: tickertape
spec:
  selector:
    matchLabels: {app: ner}
  endpoints:
    - {port: metrics, interval: 30s}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: laya
  namespace: tickertape
spec:
  selector:
    matchLabels: {app: laya}
  endpoints:
    - {port: metrics, interval: 30s}
