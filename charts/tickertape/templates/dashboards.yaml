{{- /* The Grafana dashboards, one ConfigMap each. The JSON is generated by grafana/gen_dashboards.py into dashboards/
       (inside the chart, because Helm cannot read files outside it). The monitoring stack's Grafana sidecar loads every
       ConfigMap labelled grafana_dashboard=1 in the namespaces it watches (home-lab-infra: `grafana: true` in projects/projects.yaml) and files it in
       the folder named by the grafana_folder annotation. Plain ConfigMaps, so unlike the ServiceMonitors they render
       whether or not the Prometheus Operator is installed. */ -}}
{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  labels:
    {{- include "tickertape.labels" $ | nindent 4 }}
    app.kubernetes.io/component: dashboards
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $.Values.dashboards.folder | quote }}
data:
  {{ $name }}.json: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
