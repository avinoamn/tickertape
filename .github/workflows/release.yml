name: Release

# Components are versioned independently: the container images poller, ner and laya (version in services/<svc>/VERSION)
# and the Helm chart (version in Chart.yaml), which pins one image tag per service. A release is a tag on main:
#   poller-vX.Y.Z | ner-vX.Y.Z | laya-vX.Y.Z   builds and publishes that one image and creates a GitHub Release
#   chart-vX.Y.Z                               checks the pinned images exist, packages the chart, creates a Release
# A manual run (workflow_dispatch) is a rehearsal: everything except pushing images and creating the release.

on:
  push:
    tags: ["poller-v*", "ner-v*", "laya-v*", "chart-v*"]
  workflow_dispatch:
    inputs:
      component:
        description: Component to rehearse (nothing is pushed or released)
        type: choice
        options: [poller, ner, laya, chart]
        default: chart

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      component: ${{ steps.v.outputs.component }}
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag must be checked against main's history

      - name: Work out the component and version, and check the tree and changelog agree with the tag
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          INPUT_COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            tag_re='^(poller|ner|laya|chart)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$'
            [[ "$REF_NAME" =~ $tag_re ]] \
              || { echo "::error::tag $REF_NAME must look like poller-v1.2.3, ner-v1.2.3, laya-v1.2.3 or chart-v1.2.3 (SemVer, optional -pre)"; exit 1; }
            component="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            component="$INPUT_COMPONENT"
            version=""   # rehearsal: take the version from the tree
          fi

          if [ "$component" = "chart" ]; then
            kind=chart
            tree_version=$(sed -n 's/^version: *//p' charts/tickertape/Chart.yaml)
            where="version in charts/tickertape/Chart.yaml"
          else
            kind=image
            tree_version=$(tr -d '[:space:]' < "services/$component/VERSION")
            where="services/$component/VERSION"
          fi
          [ -n "$version" ] || version="$tree_version"
          if [ "$tree_version" != "$version" ]; then
            echo "::error::$where says $tree_version but the release is $component $version: bump it in a release PR before tagging"
            exit 1
          fi

          if [ "$IS_TAG" = "true" ]; then
            # CHANGELOG.md needs a heading "## <component> <version> - <date>"
            awk -v c="$component" -v v="$version" '$1 == "##" && $2 == c && $3 == v { found = 1 } END { exit !found }' CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no '## $component $version - <date>' section: add it in the release PR"; exit 1; }
          fi

          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "component=$component"
            echo "version=$version"
            echo "kind=$kind"
            echo "prefix=ghcr.io/$owner/tickertape"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $component $version" >> "$GITHUB_STEP_SUMMARY"

      - name: The tag must be on main and its CI run must have passed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release only from merged commits"; exit 1; }
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$passed" -ge 1 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }

  image:
    name: Image (${{ needs.verify.outputs.component }})
    if: needs.verify.outputs.kind == 'image'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.verify.outputs.prefix }}-${{ needs.verify.outputs.component }}
          # Only the version tag: no `latest`, tags are never moved.
          tags: type=raw,value=${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.title=tickertape-${{ needs.verify.outputs.component }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build${{ github.event_name == 'push' && ' and push' || ' (rehearsal, not pushed)' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ needs.verify.outputs.component }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.verify.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ needs.verify.outputs.component }}

      - name: Summary
        run: |
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          {
            echo '- image: `${{ steps.meta.outputs.tags }}`'
            echo '- digest: `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  # GHCR creates a package as private on its first push. Clusters pull anonymously, so check that before releasing.
  public-pull:
    name: Image is publicly readable
    if: github.event_name == 'push' && needs.verify.outputs.kind == 'image'
    needs: [verify, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Anonymous manifest lookup
        env:
          IMAGE: ${{ needs.verify.outputs.prefix }}-${{ needs.verify.outputs.component }}:${{ needs.verify.outputs.version }}
          COMPONENT: ${{ needs.verify.outputs.component }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "ok: $IMAGE"
          else
            echo "::error::$IMAGE cannot be read without logging in. Open github.com > your profile > Packages > tickertape-$COMPONENT > Package settings > Change visibility > Public, then re-run this job."
            exit 1
          fi

  chart:
    name: Package the chart
    if: needs.verify.outputs.kind == 'chart'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Lint
        run: helm lint charts/tickertape

      # A chart that pins an image nobody can pull would break the deploy: check before releasing it.
      - name: Every pinned service image is published and public
        if: github.event_name == 'push'
        env:
          PREFIX: ${{ needs.verify.outputs.prefix }}
        run: |
          set -euo pipefail
          images=$(helm template tickertape charts/tickertape | sed -n 's/^ *image: *//p' | sort -u | grep "^${PREFIX}-" || true)
          [ "$(echo "$images" | grep -c .)" -eq 3 ] \
            || { echo "::error::the chart must pin poller, ner and laya images from ${PREFIX}-* (found: ${images:-none}): switch values.yaml to the published images in the release PR"; exit 1; }
          fail=0
          for image in $images; do
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "ok: $image"
            else
              echo "::error::$image does not exist or is not public: release that service first (and make its package public)"
              fail=1
            fi
          done
          exit "$fail"

      - name: Package
        run: |
          helm package charts/tickertape --destination dist   # the version comes from Chart.yaml, verified above
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && !failure() && !cancelled()
    needs: [verify, image, public-pull, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the packaged chart
        if: needs.verify.outputs.kind == 'chart'
        uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist

      - name: Install Helm (to list the images the chart pins)
        if: needs.verify.outputs.kind == 'chart'
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Release notes from the changelog
        env:
          COMPONENT: ${{ needs.verify.outputs.component }}
          VERSION: ${{ needs.verify.outputs.version }}
          PREFIX: ${{ needs.verify.outputs.prefix }}
        run: |
          set -euo pipefail
          awk -v c="$COMPONENT" -v v="$VERSION" '$1 == "##" { p =($2 == c && $3 == v); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty changelog section for $COMPONENT $VERSION"; exit 1; }
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          {
            echo
            if [ "$COMPONENT" = "chart" ]; then
              echo "The Helm chart \`tickertape-${VERSION}.tgz\` is attached. It pins:"
              echo
              helm template tickertape charts/tickertape 2>/dev/null | sed -n 's/^ *image: *//p' | sort -u | sed 's/^/- `/; s/$/`/'
            else
              echo "Image: \`${PREFIX}-${COMPONENT}:${VERSION}\`"
            fi
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.verify.outputs.component }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$COMPONENT $VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "$COMPONENT" = "chart" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.tgz "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}" --latest=false
          fi
