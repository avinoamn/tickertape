name: Release

# A release is a git tag vX.Y.Z on main. The tag builds and publishes the three service images to GHCR, packages the
# Helm chart, and creates a GitHub Release from CHANGELOG.md. A manual run (workflow_dispatch) is a rehearsal: it does
# everything except pushing images and creating the release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag must be checked against main's history

      - name: Work out the version and check the chart and changelog agree with it
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          chart_version=$(sed -n 's/^version: *//p' charts/tickertape/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: *//p' charts/tickertape/Chart.yaml)
          if [ "$IS_TAG" = "true" ]; then
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
            [[ "$REF_NAME" =~ $semver ]] || { echo "::error::tag $REF_NAME is not SemVer (vX.Y.Z or vX.Y.Z-pre)"; exit 1; }
            version="${REF_NAME#v}"
            grep -q "^## \[$version\]" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no '## [$version]' section: move the Unreleased entries under it in the release PR"; exit 1; }
          else
            version="$app_version"   # rehearsal: whatever Chart.yaml says
          fi
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::charts/tickertape/Chart.yaml has version=$chart_version appVersion=$app_version but the release is $version: bump both in a release PR before tagging"
            exit 1
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/$owner/tickertape" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: The tag must be on main and its CI run must have passed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release only from merged commits"; exit 1; }
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$passed" -ge 1 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }

  images:
    name: Image (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [poller, ner, laya]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.verify.outputs.prefix }}-${{ matrix.service }}
          # Only the version tag: no `latest`, tags are never moved.
          tags: type=raw,value=${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.title=tickertape-${{ matrix.service }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build${{ github.event_name == 'push' && ' and push' || ' (rehearsal, not pushed)' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          {
            echo "### ${{ matrix.service }}"
            echo '- image: `${{ steps.meta.outputs.tags }}`'
            echo '- digest: `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Package the chart
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.2
      - name: Lint and package
        run: |
          helm lint charts/tickertape
          helm package charts/tickertape --destination dist   # version and appVersion come from Chart.yaml, verified above
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  # GHCR creates a package as private on its first push. Clusters pull anonymously, so check that before releasing.
  public-pull:
    name: Images are publicly readable
    if: github.event_name == 'push'
    needs: [verify, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Anonymous manifest lookup
        env:
          PREFIX: ${{ needs.verify.outputs.prefix }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          fail=0
          for svc in poller ner laya; do
            image="${PREFIX}-${svc}:${VERSION}"
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "ok: $image"
            else
              echo "::error::$image cannot be read without logging in. Open github.com > your profile > Packages > tickertape-$svc > Package settings > Change visibility > Public, then re-run this job."
              fail=1
            fi
          done
          exit "$fail"

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [verify, images, chart, public-pull]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist

      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PREFIX: ${{ needs.verify.outputs.prefix }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [") == 1 { p = (index($0, "## [" v "]") == 1); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty changelog section for $VERSION"; exit 1; }
          {
            echo
            echo "### Container images"
            echo
            for svc in poller ner laya; do echo "- \`${PREFIX}-${svc}:${VERSION}\`"; done
            echo
            echo "The Helm chart \`tickertape-${VERSION}.tgz\` is attached. Its default image tags are this version."
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
