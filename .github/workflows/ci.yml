name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check . --output-format github
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickertape
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tickertape
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickertape"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://tickertape:test@localhost:5432/tickertape
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dashboards:
    name: Dashboards are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate and compare
        run: |
          python grafana/gen_dashboards.py
          git diff --exit-code -- grafana/dashboards \
            || { echo "::error::grafana/dashboards is out of date: run 'make dashboards' and commit the result"; exit 1; }

  manifests:
    name: Helm chart and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Plain manifests (namespace, RBAC)
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -ignore-missing-schemas -ignore-filename-pattern 'monitoring/.*' -summary /work/k8s
      - name: Chart (helm lint, render several value sets, kubeconform)
        run: make chart-check

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [poller, ner, laya]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # One stable name to require in branch protection, whatever the matrix looks like.
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, dashboards, manifests, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
